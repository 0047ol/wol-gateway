{% from "_controls.html" import action_icon %}
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>设备控制</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('wol-theme-mode');
          const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --surface: #fff;
        --text: #1e293b;
        --muted: #758298;
        --line: #e7edf5;
        --primary: #3864ec;
        --tint: #edf2ff;
        --success: #18956f;
        --screen: #253149;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #101722;
        --surface: #182230;
        --text: #e2eaf5;
        --muted: #a2b0c4;
        --line: #2b394c;
        --primary: #7899ff;
        --tint: #243353;
        --success: #50c7a1;
        --screen: #0e1624;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }

      button:disabled {
        cursor: not-allowed;
      }

      [hidden] {
        display: none !important;
      }

      main {
        flex: 1;
        min-height: 0;
        padding: 44px 18px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: min(100%, 428px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 18px 70px #16254a08;
        padding: 24px 30px 30px;
        animation: enter .32s cubic-bezier(.2, .7, .3, 1);
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
      }

      .control-header {
        align-items: flex-start;
        gap: 12px;
      }

      .account {
        position: relative;
        flex: 0 0 auto;
      }

      .account-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        z-index: 2;
        min-width: 144px;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 10px 30px #0002;
        transform-origin: top right;
        animation: pop .18s ease;
      }

      .account-menu button {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        text-align: left;
        white-space: nowrap;
      }

      .account-menu button:hover,
      .account-menu button:focus-visible {
        background: var(--bg);
      }

      .account-menu svg {
        width: 17px;
        height: 17px;
      }

      .icon-button svg {
        width: 16px;
        height: 16px;
      }

      svg.icon {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 9px;
      }

      .icon-button:hover {
        background: var(--bg);
      }

      .computer {
        display: block;
        margin: 33px auto 20px;
        width: 256px;
        max-width: 100%;
        height: auto;
        overflow: visible;
      }

      .computer .body {
        fill: var(--surface);
        stroke: var(--line);
        stroke-width: 2;
      }

      .computer .foot {
        fill: var(--bg);
        stroke: var(--line);
        stroke-width: 2;
      }

      .computer .screen {
        fill: #000;
        transition: fill .4s;
      }

      .computer .wallpaper {
        opacity: 0;
        transition: opacity .4s;
      }

      .computer .power-light {
        fill: var(--line);
        transition: fill .4s;
      }

      .computer .question {
        opacity: 0;
        fill: var(--muted);
        font: 26px system-ui;
        text-anchor: middle;
      }

      .computer[data-state="online"] .wallpaper {
        opacity: 1;
      }

      .computer[data-state="online"] .power-light,
      .computer[data-state="stopping"] .power-light {
        fill: var(--success);
      }

      .computer[data-state="unknown"] .question {
        opacity: 1;
      }

      .computer[data-state="starting"] .power-light {
        fill: var(--primary);
        animation: breathe 1.1s ease-in-out infinite;
      }

      .computer[data-state="unknown"] .screen {
        fill: var(--screen);
      }

      .screen-progress {
        display: none;
        fill: #fff;
      }

      .computer[data-state="starting"] .screen-progress,
      .computer[data-state="stopping"] .screen-progress {
        display: block;
      }

      .computer[data-state="starting"] .screen,
      .computer[data-state="stopping"] .screen {
        fill: #101722;
      }

      .loading-dots circle {
        opacity: .2;
      }

      .computer[data-state="starting"] .loading-dots circle,
      .computer[data-state="stopping"] .loading-dots circle {
        animation: boot-dot 1.2s linear infinite;
        animation-delay: calc(var(--dot) * .15s);
      }

      .screen-status {
        font: 12px system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        text-anchor: middle;
      }

      .device-info {
        display: flex;
        flex: 1;
        min-width: 0;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding-top: 3px;
      }

      .device-info h1 {
        color: var(--text);
        font-size: 19px;
        margin: 0;
        max-width: 100%;
      }

      .device-info .badge {
        flex: 0 0 auto;
      }

      h1 {
        font-size: 23px;
        line-height: 1.4;
        font-weight: 650;
        margin: 0 0 9px;
        overflow-wrap: anywhere;
        letter-spacing: -.3px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 7px;
        font-size: 12px;
        color: var(--muted);
        background: var(--bg);
      }

      .badge[data-state="online"] {
        color: var(--success);
        background: color-mix(in srgb, var(--success) 10%, var(--surface));
      }

      .badge[data-state="online"]::before,
      .badge[data-state="offline"]::before {
        content: "";
        width: 5px;
        height: 5px;
        background: currentColor;
        border-radius: 50%;
      }

      .message {
        min-height: 46px;
        margin: 19px 0 21px;
        font-size: 13px;
        line-height: 1.7;
        color: var(--muted);
        text-align: center;
        display: grid;
        place-items: center;
      }

      .actions {
        display: flex;
        justify-content: center;
      }

      .action {
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border: 1px solid var(--primary);
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-weight: 550;
        transition: transform .15s, background .15s;
      }

      .action svg {
        width: 19px;
        height: 19px;
      }

      .action:active:not(:disabled) {
        transform: scale(.97);
      }

      .action:disabled {
        background: var(--bg);
        border-color: var(--line);
        color: var(--muted);
        opacity: .65;
      }

      .power-button {
        --power-accent: #3864ec;
        --power-ink: var(--power-accent);
        width: 72px;
        height: 72px;
        flex: 0 0 auto;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border-radius: 50%;
        border-color: var(--power-accent);
        background: var(--power-accent);
        box-shadow: 0 6px 20px color-mix(in srgb, var(--power-accent) 18%, transparent);
      }

      .power-button[data-tone="shutdown"] {
        --power-accent: #cc3c45;
      }

      .power-button[data-tone="wake"] {
        border-color: currentColor;
        background: transparent;
        color: var(--power-ink);
        box-shadow: none;
      }

      :root[data-theme="dark"] .power-button {
        --power-ink: color-mix(in srgb, var(--power-accent) 55%, white);
      }

      .power-button .power-icon {
        width: 28px;
        height: 28px;
      }

      .power-button:focus-visible {
        outline-color: var(--power-ink);
      }

      .power-button:disabled {
        background: var(--bg);
        border-color: var(--line);
        color: var(--muted);
        opacity: 1;
        box-shadow: none;
      }

      .power-button[aria-busy="true"] {
        background: color-mix(in srgb, var(--power-accent) 12%, var(--surface));
        border-color: color-mix(in srgb, var(--power-accent) 24%, var(--surface));
        color: var(--power-ink);
      }

      .login-art {
        width: 60px;
        height: 60px;
        display: grid;
        place-items: center;
        color: var(--primary);
        background: var(--tint);
        border-radius: 18px;
        margin: 34px auto 21px;
      }

      .login-art svg {
        width: 28px;
        height: 28px;
      }

      .subtitle {
        color: var(--muted);
        text-align: center;
        margin: 0 0 28px;
        font-size: 13px;
      }

      label {
        display: block;
        margin: 17px 0 7px;
        color: var(--muted);
        font-size: 12px;
      }

      input {
        width: 100%;
        height: 45px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0 13px;
        background: var(--surface);
        color: var(--text);
      }

      input::placeholder {
        color: var(--muted);
        opacity: .7;
      }

      .login-submit {
        width: 100%;
        margin-top: 25px;
      }

      .inactive {
        padding-bottom: 55px;
      }

      .inactive h1 {
        margin: 42px 0 12px;
        text-align: center;
      }

      .toast {
        padding: 12px 18px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        border-radius: 12px;
        box-shadow: 0 10px 40px #0002;
        font-size: 13px;
        animation: toast-in .22s ease;
      }

      dialog {
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 27px;
        width: min(380px, calc(100vw - 32px));
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 25px 80px #0002;
      }

      dialog[open] {
        animation: pop .26s cubic-bezier(.2, .7, .3, 1);
      }

      dialog::backdrop {
        background: #0c172966;
        backdrop-filter: blur(4px);
      }

      dialog h2 {
        margin: 0;
        font-size: 19px;
      }

      .dialog-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 13px;
      }

      .dialog-symbol {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: #3864ec1a;
        color: var(--primary);
      }

      .dialog-symbol svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      dialog p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.8;
        font-size: 13px;
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .dialog-actions button {
        padding: 9px 18px;
        min-height: 41px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
      }

      .dialog-actions button:last-child {
        background: #cc3c45;
        border-color: #cc3c45;
        color: #fff;
      }

      @media (max-width: 600px) {
        .dialog-actions button {
          flex: 1 1 0;
          min-width: 0;
          min-height: 44px;
          white-space: normal;
          overflow-wrap: anywhere;
        }
      }

      @keyframes enter {
        from {
          opacity: .3;
          transform: translateY(14px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(16px) scale(.94);
        }

        72% {
          transform: translateY(-2px) scale(1.01);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes breathe {
        50% {
          opacity: .3;
        }
      }

      @keyframes boot-dot {

        0%,
        15% {
          opacity: 1;
        }

        85%,
        100% {
          opacity: .2;
        }
      }

      @media (max-width: 480px),
      (pointer: coarse) {
        .icon-button {
          width: 44px;
          height: 44px;
        }

        input {
          font-size: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }

      @media (max-width: 480px) {
        main {
          padding: 25px 16px;
        }

        .card {
          padding: 20px 23px 25px;
        }

        .computer {
          margin-top: 31px;
        }
      }

      .icon-button {
        text-decoration: none;
        flex: 0 0 auto;
      }

      .icon-button:disabled,
      .account-menu button:disabled,
      .login-submit:disabled {
        cursor: wait;
        opacity: .55;
      }

      a:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }

      .power-button.waiting {
        cursor: wait;
      }

      .form-feedback {
        color: #b33b46;
        font-size: 13px;
        margin: 14px 0 0;
        overflow-wrap: anywhere;
      }

      :root[data-theme="dark"] .form-feedback {
        color: #ffa0a8;
      }

      .toast-region {
        position: fixed;
        top: 0;
        padding-top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        width: min(380px, calc(100vw - 32px));
        display: grid;
        gap: 10px;
        z-index: 10;
        pointer-events: none;
      }

      .toast-region .toast {
        position: static;
        transform: none;
        width: 100%;
        max-width: 100%;
        margin: 0;
        pointer-events: auto;
        overflow: auto;
        overflow-wrap: anywhere;
        max-height: min(180px, calc((var(--notice-height, 100svh) - 96px) / 3));
      }

      .toast.error {
        color: #a33b3b;
        border-color: #e19a9a;
      }

      :root[data-theme="dark"] .toast.error {
        color: #ffaaaa;
        border-color: #a8626d;
      }

      @media (max-width: 600px),
      (pointer: coarse) {
        .toast-region {
          left: 50%;
          right: auto;
          transform: translateX(-50%);
        }
      }
    </style>
  </head>

  <body>
    <main>
      {% include "share_card.html" %}
    </main>
    <dialog id="confirm"
            aria-labelledby="confirm-title"
            aria-describedby="confirm-description">
      <div class="dialog-heading">
        <span class="dialog-symbol" aria-hidden="true">{{ action_icon("关机", false) }}</span>
        <h2 id="confirm-title">确认关机</h2>
      </div>
      <p id="confirm-description">关机前请确认工作已保存。</p>
      <form method="dialog" class="dialog-actions">
        <button value="cancel">取消</button><button value="ok">确认关机</button>
      </form>
    </dialog>
    <div id="control-message"
         class="toast-region"
         aria-live="polite"
         aria-relevant="additions"></div>
    <script src="/static/i18n.js?v=20261106-07"></script>
    <script>
      const token = {{ token|default('')|tojson }};
      let mode = {{ mode|tojson }};
      let identity = {{ identity|default('')|tojson }};
      const shareCsrfCookieName = {{ csrf_cookie|default('')|tojson }};
      const csrf = () => {
        const name = identity === 'admin' ? 'wol_csrf' : shareCsrfCookieName;
        return document.cookie.split('; ').find(value => value.startsWith(name + '='))?.slice(name.length + 1) || '';
      };
      const notices = [];
      const message = (value, error = false) => {
        const login = document.getElementById('login-message');
        if (login) {
          login.textContent = t(value || '');
          login.hidden = !value;
          return;
        }
        const region = document.getElementById('control-message');
        if (!value) {
          notices.length = 0;
          region.replaceChildren();
          return;
        }
        notices.push({
          value,
          error
        });
        drainNotices();
      };

      function drainNotices() {
        const region = document.getElementById('control-message');
        while (region.children.length < 3 && notices.length) {
          const notice = notices.shift(),
            node = document.createElement('div');
          node.className = 'toast' + (notice.error ? ' error' : '');
          node.setAttribute('role', notice.error ? 'alert' : 'status');
          node.textContent = t(notice.value);
          region.append(node);
          setTimeout(() => {
            node.remove();
            drainNotices();
          }, 3600);
        }
      }

      function placeNotices() {
        const region = document.getElementById('control-message');
        const viewport = window.visualViewport;
        const width = viewport?.width || innerWidth;
        const mobile = matchMedia('(max-width: 600px), (pointer: coarse)').matches;
        const size = Math.max(0, Math.min(380, width - 32));
        region.style.width = size + 'px';
        region.style.left = ((viewport?.offsetLeft || 0) + (mobile ? (width - size) / 2 : width - size - 16)) + 'px';
        region.style.top = (viewport?.offsetTop || 0) + 'px';
        region.style.right = 'auto';
        region.style.transform = 'none';
        region.style.setProperty('--notice-height', (viewport?.height || innerHeight) + 'px');
      }
      placeNotices();
      window.addEventListener('resize', placeNotices);
      window.visualViewport?.addEventListener('resize', placeNotices);
      window.visualViewport?.addEventListener('scroll', placeNotices);
      document.addEventListener('close', () => document.body.append(document.getElementById('control-message')), true);
      async function readJSON(url, options = {}) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 12000);
        try {
          const response = await fetch(url, {
            ...options,
            cache: 'no-store',
            signal: controller.signal
          });
          let data = {};
          try {
            data = await response.json();
          } catch (_) {}
          if (!response.ok || data.ok !== true) {
            const error = new Error(typeof data.detail === 'string' ? data.detail : data.msg || '请求失败，请稍后重试');
            error.status = response.status;
            throw error;
          }
          return data;
        } finally {
          clearTimeout(timeout);
        }
      }
      let currentState = {{ state|default(None)|tojson }};
      let pendingAction = '';
      let submitting = false,
        confirming = false,
        stateFresh = true;
      let pollTimer, refreshPromise, viewEvents;
      const sharePath = '/api/share/' + encodeURIComponent(token);

      function actionLabel(action) {
        return action === 'shutdown' ? '关机' : action === 'wake' ? '开机' : '状态未知';
      }

      function applyState(state) {
        if (!state) return;
        const previousOperation = currentState?.operation;
        currentState = state;
        const computer = document.getElementById('computer'),
          badge = document.getElementById('device-state'),
          button = document.getElementById('power'),
          label = document.getElementById('screen-status');
        if (!computer || !badge || !button || !label) return;
        const operation = state.operation && ['sending', 'waiting'].includes(state.operation.status) ? state.operation : null;
        if (previousOperation && ['sending', 'waiting'].includes(previousOperation.status) && state.operation && !operation) {
          message(state.operation.message || '状态尚未确认，请稍后刷新', state.operation.status !== 'completed');
        }
        pendingAction = operation?.action || (submitting ? pendingAction : '');
        const busy = Boolean(pendingAction);
        const action = busy ? pendingAction : state.can_shutdown ? 'shutdown' : state.can_wake ? 'wake' : '';
        const visualState = busy ? (pendingAction === 'wake' ? 'starting' : 'stopping') : state.status;
        computer.dataset.state = stateFresh ? visualState : 'unknown';
        badge.dataset.state = stateFresh ? state.status : 'unknown';
        badge.textContent = t(stateFresh ? state.status_label : '未知');
        document.getElementById('device-name').textContent = state.name || '';
        const description = state.reason || operation?.message || (busy ? (pendingAction === 'shutdown' ? '正在等待电脑离线' : '正在等待电脑上线') : state.can_shutdown ? '电脑已连接，可以远程关机。' : state.can_wake ? '电脑当前离线，可以发送开机唤醒。' : '暂时无法确认设备状态，请稍后刷新。');
        document.getElementById('device-message').textContent = t(stateFresh ? description : '状态读取失败，请刷新后重试');
        button.dataset.action = stateFresh ? action : '';
        button.dataset.tone = action === 'shutdown' ? 'shutdown' : 'wake';
        button.classList.toggle('waiting', busy);
        button.disabled = !stateFresh || busy || !action;
        const busyLabel = pendingAction === 'shutdown' ? '关机中…' : '开机中…';
        label.textContent = stateFresh && busy ? t(busyLabel) : '';
        const accessibleLabel = stateFresh && busy ? busyLabel : actionLabel(stateFresh ? action : '');
        button.setAttribute('aria-label', t(accessibleLabel));
        computer.setAttribute('aria-label', t(stateFresh && busy ? busyLabel : '电脑状态示意'));
        if (!busy) button.removeAttribute('aria-busy');
        else button.setAttribute('aria-busy', 'true');
        const confirmation = document.getElementById('confirm');
        if (confirming && !state.can_shutdown && confirmation?.open) confirmation.close('cancel');
      }

      function scheduleRefresh() {
        clearTimeout(pollTimer);
        if (!document.hidden && token) pollTimer = setTimeout(refreshState, 2000);
      }

      function refreshState() {
        if (!token) return Promise.resolve();
        if (refreshPromise) return refreshPromise;
        refreshPromise = (async () => {
          try {
            const data = await readJSON(sharePath + '/view?current_view=' + encodeURIComponent(mode + ':' + identity));
            if (data.mode !== mode || data.identity !== identity) {
              const fragment = document.createElement('template');
              fragment.innerHTML = data.html || '';
              const card = fragment.content.querySelector('.card');
              if (!card) throw new Error('请求失败，请稍后重试');
              const dialog = document.getElementById('confirm');
              if (dialog.open) dialog.close('cancel');
              document.querySelector('main > .card').replaceWith(card);
              mode = data.mode;
              identity = data.identity;
              pendingAction = '';
              bindView();
              window.localizeUI?.(card);
            }
            if (!stateFresh) message('');
            stateFresh = true;
            currentState = mode === 'control' ? currentState : null;
            applyState(data.state);
          } catch (error) {
            stateFresh = false;
            applyState(currentState);
            const dialog = document.getElementById('confirm');
            if (dialog.open) dialog.close('cancel');
            message(error.message, true);
          } finally {
            refreshPromise = null;
            scheduleRefresh();
          }
        })();
        return refreshPromise;
      }
      async function power() {
        const button = document.getElementById('power'),
          action = button?.dataset.action;
        if (!action || button.disabled || pendingAction || confirming || submitting || !stateFresh) return;
        if (action === 'shutdown') {
          const dialog = document.getElementById('confirm');
          confirming = true;
          dialog.returnValue = 'cancel';
          dialog.showModal();
          dialog.append(document.getElementById('control-message'));
          const result = await new Promise(resolve => dialog.addEventListener('close', () => resolve(dialog.returnValue), {
            once: true
          }));
          confirming = false;
          if (result !== 'ok' || !stateFresh || !currentState?.can_shutdown || pendingAction) return;
        }
        submitting = true;
        pendingAction = action;
        clearTimeout(pollTimer);
        applyState({
          ...currentState,
          operation: {
            action,
            status: 'sending'
          },
          reason: action === 'shutdown' ? '正在等待电脑离线' : '正在等待电脑上线'
        });
        try {
          const data = await readJSON(sharePath + '/power', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              'X-CSRF-Token': csrf()
            },
            body: new URLSearchParams({
              action
            })
          });
          message(data.msg || '操作已提交');
        } catch (error) {
          message(error.message, true);
        } finally {
          submitting = false;
          await refreshState();
        }
      }

      function bindView() {
        viewEvents?.abort();
        viewEvents = new AbortController();
        const events = {
          signal: viewEvents.signal
        };
        if (mode === 'login') document.getElementById('login-form').addEventListener('submit', async event => {
          event.preventDefault();
          const button = event.target.querySelector('button[type=submit]');
          if (button.disabled) return;
          button.disabled = true;
          try {
            const data = await readJSON(sharePath + '/login', {
              method: 'POST',
              body: new URLSearchParams(new FormData(event.target))
            });
            await refreshState();
          } catch (error) {
            message(error.message, true);
          } finally {
            button.disabled = false;
          }
        }, events);
        if (mode === 'control') {
          document.getElementById('power').addEventListener('click', power, events);
          const accountToggle = document.getElementById('account-toggle');
          const accountMenu = document.getElementById('account-menu');

          function closeAccountMenu(restoreFocus = false) {
            accountMenu.hidden = true;
            accountToggle.setAttribute('aria-expanded', 'false');
            if (restoreFocus) accountToggle.focus();
          }

          function openAccountMenu(focusItem = false) {
            accountMenu.hidden = false;
            accountToggle.setAttribute('aria-expanded', 'true');
            if (focusItem) accountMenu.querySelector('[role="menuitem"]').focus();
          }
          accountToggle.addEventListener('click', () => accountMenu.hidden ? openAccountMenu() : closeAccountMenu(), events);
          accountToggle.addEventListener('keydown', event => {
            if (['ArrowDown', 'ArrowUp'].includes(event.key)) {
              event.preventDefault();
              openAccountMenu(true);
            }
          }, events);
          document.addEventListener('click', event => {
            if (!event.target.closest('.account')) closeAccountMenu();
          }, events);
          document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !accountMenu.hidden) {
              event.preventDefault();
              closeAccountMenu(true);
            }
          }, events);
          document.querySelector('.account').addEventListener('focusout', event => {
            if (!event.currentTarget.contains(event.relatedTarget)) closeAccountMenu();
          }, events);
          document.getElementById('return-admin')?.addEventListener('click', () => location.assign('/'), events);
          document.getElementById('logout')?.addEventListener('click', async event => {
            const button = event.currentTarget;
            if (button.disabled) return;
            button.disabled = true;
            try {
              const data = await readJSON(sharePath + '/logout', {
                method: 'POST',
                headers: {
                  'X-CSRF-Token': csrf()
                }
              });
              await refreshState();
            } catch (error) {
              message(error.message, true);
            } finally {
              button.disabled = false;
            }
          }, events);
        }
      }
      bindView();
      applyState(currentState);
      if (token) {
        document.addEventListener('visibilitychange', () => {
          clearTimeout(pollTimer);
          if (!document.hidden) refreshState();
        });
        document.addEventListener('wol:language-changed', () => applyState(currentState));
        window.addEventListener('focus', () => {
          if (!document.hidden) refreshState();
        });
        window.addEventListener('online', () => {
          if (!document.hidden) refreshState();
        });
        window.addEventListener('pagehide', () => clearTimeout(pollTimer));
        window.addEventListener('pageshow', event => {
          if (event.persisted) refreshState();
        });
        scheduleRefresh();
      }
    </script>
  </body>
</html>
